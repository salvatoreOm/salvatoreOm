<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-label="Om Parihar — Software Developer, Open Source Contributor, Entrepreneur">
<title>Om Parihar</title>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f78166"/><stop offset="1" stop-color="#ffa657"/></linearGradient>
  <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7"><stop offset="0" stop-color="#f78166" stop-opacity=".18"/><stop offset="1" stop-color="#f78166" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
  <clipPath id="card"><rect width="840" height="260" rx="18"/></clipPath>
  <style>
    .ln{opacity:0;animation:in .45s ease forwards}
    .cur{animation:blink 1.1s steps(1) infinite}
    .rise{animation:rise .7s ease both}
    @keyframes in{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
    @keyframes blink{50%{opacity:0}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="840" height="260" fill="#0d1117"/>
  <rect width="840" height="260" fill="url(#dots)"/>
  <rect width="840" height="260" fill="url(#glow)"/>
  <rect y="257" width="840" height="3" fill="url(#acc)"/>
</g>
<rect x=".5" y=".5" width="839" height="259" rx="18" fill="none" stroke="#30363d"/>

<g class="rise">
  <text x="40" y="70" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1" fill="#8b949e">~/salvatoreOm</text>
  <text x="38" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" letter-spacing="-1" fill="#e6edf3">Om Parihar</text>
  <text x="40" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="url(#acc)">Software Developer · Open Source · Entrepreneur</text>
  <text x="40" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">I build backend systems in Go — APIs, event</text>
  <text x="40" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e">pipelines, and the cloud they run on.</text>
</g>

<g>
  <rect x="488" y="40" width="316" height="180" rx="12" fill="#161b22" stroke="#30363d"/>
  <path d="M488 74h316" stroke="#30363d"/>
  <circle cx="506" cy="57" r="5" fill="#ff5f57"/>
  <circle cx="524" cy="57" r="5" fill="#febc2e"/>
  <circle cx="542" cy="57" r="5" fill="#28c840"/>
  <text x="666.0" y="61" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#8b949e">om@gurugram: ~</text>
  <g class="ln" style="animation-delay:0.30s"><text x="508" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">$</text><text x="526" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">whoami --experience</text></g><g class="ln" style="animation-delay:0.65s"><text x="508" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#ffa657">›</text><text x="526" y="132" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">SWE Intern · INDmoney</text></g><g class="ln" style="animation-delay:1.00s"><text x="508" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#ffa657">›</text><text x="526" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">SWE Intern · Tally Solutions</text></g><g class="ln" style="animation-delay:1.35s"><text x="508" y="184" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#ffa657">›</text><text x="526" y="184" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">Founder · Zhecker Technologies</text></g>
  <text x="508" y="210" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">$</text>
  <rect class="cur" x="526" y="199" width="8" height="14" fill="#ffa657"/>
</g>
</svg>